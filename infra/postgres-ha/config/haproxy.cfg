global
    log stdout format raw local0
    maxconn 128

defaults
    log global
    mode tcp
    timeout connect 3s
    timeout client 60s
    timeout server 60s
    timeout check 2s

frontend postgres_write
    bind *:5432
    default_backend patroni_primary

backend patroni_primary
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 1s fall 2 rise 2 on-marked-down shutdown-sessions
    server pg1 pg1:5432 check port 8008
    server pg2 pg2:5432 check port 8008
    server pg3 pg3:5432 check port 8008
