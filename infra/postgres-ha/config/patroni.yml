scope: hyrule-ha
namespace: /hyrule/
restapi:
  listen: 0.0.0.0:8008
etcd3:
  hosts: etcd1:2379,etcd2:2379,etcd3:2379
bootstrap:
  dcs:
    ttl: 30
    loop_wait: 5
    retry_timeout: 5
    synchronous_mode: true
    synchronous_mode_strict: true
    synchronous_node_count: 1
    check_timeline: true
    postgresql:
      use_pg_rewind: true
      use_slots: true
      parameters:
        wal_level: replica
        max_wal_senders: 10
        max_replication_slots: 10
        wal_keep_size: 128MB
        max_slot_wal_keep_size: 512MB
        max_wal_size: 512MB
        shared_buffers: 64MB
        max_connections: 50
        synchronous_commit: 'on'
        archive_mode: 'on'
        archive_command: 'wal-g wal-push "%p"'
        archive_timeout: 30s
        restore_command: 'wal-g wal-fetch "%f" "%p"'
  initdb:
    - encoding: UTF8
    - data-checksums
  pg_hba:
    - local all all trust
    - host replication replicator 0.0.0.0/0 scram-sha-256
    - host all all 0.0.0.0/0 scram-sha-256
postgresql:
  listen: 0.0.0.0:5432
  data_dir: /var/lib/postgresql/data/pgdata
  bin_dir: /usr/lib/postgresql/16/bin
  authentication:
    superuser:
      username: postgres
      password: postgres-ha-local
    replication:
      username: replicator
      password: replication-ha-local
  create_replica_methods:
    - basebackup
  basebackup:
    checkpoint: fast
