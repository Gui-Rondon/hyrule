# Adds Elasticsearch to the framework's own docker-compose.yml (mongo,
# pubsub, redis, postgres), for posts-api/authors-api/tags-api's optional
# search indexing (behaviors/searchsync).
#
# From the repo root: docker compose -f examples/blog-apis/docker-compose.yml --profile debug up
include:
  - path: ../../docker-compose.yml

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.29
    profiles: ["debug"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf localhost:9200/_cluster/health"]
      interval: 5s
      retries: 30
