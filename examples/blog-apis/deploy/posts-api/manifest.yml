# Illustrative only: a generic Deployment + Service + HPA for posts-api,
# with no environment-specific values. Replace the image, host and
# resource requests before using this anywhere real.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: posts-api
  labels:
    app: posts-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: posts-api
  template:
    metadata:
      labels:
        app: posts-api
    spec:
      containers:
        - name: posts-api
          image: ghcr.io/example/posts-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: CONFIG_FILE
              value: /etc/posts-api/config.json
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /status
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: posts-api
spec:
  selector:
    app: posts-api
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: posts-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: posts-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
