name: Vulnerabilities
on:
  pull_request: {}
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: Go vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: govulncheck ./...
      - name: Refresh example module graphs for this checkout
        run: make examples-tidy
      - run: govulncheck ./...
        working-directory: examples/router-composition
      - run: govulncheck ./...
        working-directory: examples/standalone-tags-api
