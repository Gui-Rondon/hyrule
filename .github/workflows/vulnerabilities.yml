name: Vulnerabilities
on:
  pull_request: {}
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: Go vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          check-latest: true
          go-version: '1.27.x'
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: govulncheck ./...
      - name: Refresh example module graphs for this checkout
        run: make examples-tidy
      - run: govulncheck ./...
        working-directory: examples/router-composition
      - run: govulncheck ./...
        working-directory: examples/standalone-tags-api
      # PR/push website auditing is part of the existing documentation job.
      # This lightweight scheduled check also catches new advisories without edits.
      - if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        name: Audit all website and build dependencies
        run: npm audit --package-lock-only --ignore-scripts
        working-directory: website
