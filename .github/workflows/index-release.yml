name: Index release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing published v0 tag to request from the Go proxy
        type: string
        required: true
permissions:
  contents: read
jobs:
  index:
    if: github.ref == 'refs/heads/main' && github.actor == 'Gui-Rondon'
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.x'
      - name: Validate tag and request indexing without changing it
        run: |
          HYRULE_INDEX_ONLY=true bash ci/release/validate.sh "$RELEASE_VERSION"
          git rev-parse --verify "refs/tags/$RELEASE_VERSION^{commit}"
          HYRULE_INDEX_ONLY=true bash ci/release/index.sh "$RELEASE_VERSION"
