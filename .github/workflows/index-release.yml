name: Index release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing published v0 tag to request from the Go proxy
        type: string
        required: true
permissions:
  contents: read
jobs:
  index:
    if: github.ref == 'refs/heads/main' && github.actor == 'Gui-Rondon'
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          check-latest: true
          go-version: '1.27.x'
      - name: Validate tag and request indexing without changing it
        run: |
          HYRULE_INDEX_ONLY=true bash ci/release/validate.sh "$RELEASE_VERSION"
          git rev-parse --verify "refs/tags/$RELEASE_VERSION^{commit}"
          HYRULE_INDEX_ONLY=true bash ci/release/index.sh "$RELEASE_VERSION"
