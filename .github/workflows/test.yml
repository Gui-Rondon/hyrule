name: Test
on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Go ${{ matrix.go }} integration
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', '1.27.x']
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: Start real backend integrations
        run: make env-up
      - name: Require ready databases and emulators
        run: |
          docker compose exec -T mongo mongosh --quiet --eval 'if (!rs.status().ok) quit(1)'
          docker compose exec -T postgres pg_isready -U postgres
          curl --fail --silent --show-error --output /dev/null \
            --retry 15 --retry-delay 2 --retry-all-errors --retry-max-time 60 \
            --connect-timeout 2 --max-time 3 \
            http://127.0.0.1:8085/v1/projects/local-dev/topics
          docker compose exec -T redis redis-cli ping
      - name: Tests with real backends, race detector and latest-Go coverage
        env:
          GO_VERSION: ${{ matrix.go }}
        run: |
          if [[ "$GO_VERSION" == '1.27.x' ]]; then
            make cover COVERAGE_TEST_FLAGS=-race
          else
            make test
          fi
      - run: make vet
      - name: Refresh example module graphs for this checkout
        run: make examples-tidy
      - run: make router-example-test
      - run: make standalone-example-test
      - name: Upload coverage
        if: matrix.go == '1.27.x' && github.event_name != 'pull_request'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: .local/coverage.out
          fail_ci_if_error: true
      - name: Pub/Sub healthcheck diagnostics on failure
        if: failure()
        run: |
          docker compose ps --all
          pubsub_container=$(docker compose ps --all --quiet pubsub)
          if [ -n "$pubsub_container" ]; then
            docker inspect "$pubsub_container" --format '{{json .State.Health}}'
          fi
      - name: Backend logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop integration environment
        if: always()
        run: docker compose stop
  docs:
    name: Documentation EN and PT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website
  windows:
    name: Windows SQLite and CLI
    runs-on: windows-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
      - run: go test ./platform/sqlite ./restsqlite
      - run: go test ./app -run 'TestSQLite|Example'
      - run: go test ./cmd/hyrule -run 'TestRunDispatch|TestRunNew|TestRunService|TestProjectAndVersionValidation'
      - run: go build -o hyrule.exe ./cmd/hyrule
      - run: ./hyrule.exe --help
