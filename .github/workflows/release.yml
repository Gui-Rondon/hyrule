name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New v0 SemVer tag (for example v0.103.0)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main' && github.actor == 'Gui-Rondon'
    name: Release validation Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', '1.27.x']
    env:
      GOTOOLCHAIN: local
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: bash ci/release/validate.sh "$RELEASE_VERSION"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go }}
      - run: make env-up
      - name: Tests and coverage without repeating the full suite
        env:
          GO_VERSION: ${{ matrix.go }}
        run: |
          if [[ "$GO_VERSION" == '1.27.x' ]]; then
            make cover COVERAGE_TEST_FLAGS=-race
          else
            make test
          fi
      - run: make vet examples-tidy router-example-test standalone-example-test
      - if: always()
        run: docker compose stop
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.x'
      - name: Refuse already published releases
        run: |
          if gh release view "$RELEASE_VERSION" --json isDraft --jq 'select(.isDraft == false)' | grep -q .; then
            echo 'Release already published. Use Index release to retry proxy indexing.' >&2
            exit 1
          fi
      - run: bash ci/release/build.sh "$RELEASE_VERSION"
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        id: provenance
        with:
          subject-path: '.local/release/*'
      - name: Verify and retain signed SLSA provenance
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          for artifact in .local/release/*; do
            gh attestation verify "$artifact" --bundle "$BUNDLE_PATH" --repo "$GH_REPO" \
              --signer-workflow "$GH_REPO/.github/workflows/release.yml" \
              --source-digest "$GITHUB_SHA" --predicate-type https://slsa.dev/provenance/v1
          done
          cp "$BUNDLE_PATH" .local/release/provenance.sigstore.json
      - name: Create tag and publish release
        run: |
          if ! git rev-parse --verify "refs/tags/$RELEASE_VERSION" >/dev/null 2>&1; then
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref="refs/tags/$RELEASE_VERSION" -f sha="$GITHUB_SHA"
          fi
          if ! gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release create "$RELEASE_VERSION" --verify-tag --draft --title "$RELEASE_VERSION" --notes-file CHANGELOG.md
          fi
          gh release upload "$RELEASE_VERSION" .local/release/* --clobber
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            gh release edit "$RELEASE_VERSION" --draft=false --prerelease
          else
            gh release edit "$RELEASE_VERSION" --draft=false --latest
          fi
      - name: Request module indexing
        run: bash ci/release/index.sh "$RELEASE_VERSION"
      - name: Document asynchronous index checks
        run: |
          echo "Package docs: https://pkg.go.dev/github.com/Gui-Rondon/hyrule/app@$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo 'pkg.go.dev and deps.dev ingestion is asynchronous; see docs/releasing.md.' >> "$GITHUB_STEP_SUMMARY"
