name: Bug report
description: Report a reproducible problem (use private reporting for security issues)
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction, expected and observed behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Hyrule version, Go version and backend
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (remove credentials and private data)
